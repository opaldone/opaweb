{{ define "_reca" }}
  {{ if (index . "recserv") }}
    <div class="lbl-tha with-count">
      <button
        id="tg-rec-serv"
        class="btn-rb hint-able"
        data-hint="{{ re "Start record on the server" }}"
        data-thint="{{ re "Stop record on server" }}"
        data-recstart="{{ ro "vi_start" }}"
        data-recstop="{{ ro "vi_stop" }}"
        data-recupt="{{ ro "vi_uptime" }}"
      >
        <span class="ra-ico">
          <svg width="24" height="24" fill="#575757" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path d="M320 112C434.9 112 528 205.1 528 320C528 434.9 434.9 528 320 528C205.1 528 112 434.9 112 320C112 205.1 205.1 112 320 112zM320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM276.5 211.5C269.1 207 259.8 206.8 252.2 211C244.6 215.2 240 223.3 240 232L240 408C240 416.7 244.7 424.7 252.3 428.9C259.9 433.1 269.1 433 276.6 428.4L420.6 340.4C427.7 336 432.1 328.3 432.1 319.9C432.1 311.5 427.7 303.8 420.6 299.4L276.6 211.4zM362 320L288 365.2L288 274.8L362 320z"/>
          </svg>
        </span>
      </button>
      <div id="rec-serv-timer" class="lbl-count">
        00:01:23
      </div>
    </div>
  {{ end }}
  <div class="lbl-tha on-desk">
    <button
      id="tg-rec"
      class="btn-rb hint-able"
      data-hint="{{ re "Start record on the client" }}"
      data-thint="{{ re "Stop record on client" }}"
    >
      <span class="ra-ico">
        <svg width="24" height="24" fill="#575757" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
          <path d="M128 128C128 92.7 156.7 64 192 64L448 64C483.3 64 512 92.7 512 128L512 545.1C512 570.7 483.5 585.9 462.2 571.7L320 476.8L177.8 571.7C156.5 585.9 128 570.6 128 545.1L128 128zM192 112C183.2 112 176 119.2 176 128L176 515.2L293.4 437C309.5 426.3 330.5 426.3 346.6 437L464 515.2L464 128C464 119.2 456.8 112 448 112L192 112z"/>
        </svg>
      </span>
    </button>
  </div>
{{ end }}
